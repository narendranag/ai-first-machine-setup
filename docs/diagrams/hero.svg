<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Install the operator first</title><desc id="d">A terminal with the four commands a human types — Xcode command line tools, Homebrew, GitHub CLI, Claude Code — beside the list of what Claude Code then sets up: machine map, keys, Tailscale, Bitwarden, hooks, Brewfiles, brains, workflows.</desc><defs><marker id="m0E7C66" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#0E7C66"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#E3DFD6" stroke-width="3"/></pattern></defs><rect width="1280" height="420" fill="#FBFAF7"/><text x="48" y="78" font-size="12" font-weight="700" fill="#0E7C66" text-anchor="start" letter-spacing="0.16em">AI-FIRST MACHINE SETUP</text><text x="46" y="136" font-size="48" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="-0.02em">Install the</text><text x="46" y="188" font-size="48" font-weight="700" fill="#1C1B19" text-anchor="start" letter-spacing="-0.02em">operator first.</text><text x="48" y="232" font-size="17.5" font-weight="400" fill="#6E6A63" text-anchor="start">Type four commands. Claude Code sets up and</text><text x="48" y="257" font-size="17.5" font-weight="400" fill="#6E6A63" text-anchor="start">runs everything else on your machines.</text><rect x="48" y="300" width="148" height="34" rx="17" fill="#C4461B" stroke="#C4461B" stroke-width="1.2" fill-opacity="0.12"/><text x="122" y="322" font-size="13.5" font-weight="650" fill="#C4461B" text-anchor="middle">you authenticate</text><rect x="206" y="300" width="148" height="34" rx="17" fill="#B07A12" stroke="#B07A12" stroke-width="1.2" fill-opacity="0.12"/><text x="280" y="322" font-size="13.5" font-weight="650" fill="#B07A12" text-anchor="middle">you set the mode</text><rect x="364" y="300" width="148" height="34" rx="17" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1.2" fill-opacity="0.12"/><text x="438" y="322" font-size="13.5" font-weight="650" fill="#2F5BD3" text-anchor="middle">you decide</text><text x="48" y="366" font-size="13" font-weight="500" fill="#A39E95" text-anchor="start">The human&#x27;s three jobs. The rest is scripts, hooks and conversation.</text><rect x="548" y="49.5" width="352" height="324" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="548" y="48" width="352" height="324" rx="14" fill="#15151A" stroke="#2A2A31" stroke-width="1"/><circle cx="568" cy="67" r="5" fill="#FF5F57"/><circle cx="584" cy="67" r="5" fill="#FEBC2E"/><circle cx="600" cy="67" r="5" fill="#28C840"/><text x="724.0" y="71" font-size="11" font-weight="600" fill="#8A8790" text-anchor="middle">Terminal.app</text><text x="568" y="118" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">1</text><text x="588" y="118" font-size="12.5" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ xcode-select --install</text><text x="568" y="152" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">2</text><text x="588" y="152" font-size="12.5" font-weight="500" fill="#8A8790" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"># Homebrew: the one-liner on brew.sh</text><text x="568" y="186" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">3</text><text x="588" y="186" font-size="12.5" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ brew install gh</text><text x="588" y="220" font-size="12.5" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ gh auth login</text><text x="568" y="254" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">4</text><text x="588" y="254" font-size="12.5" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ brew install --cask claude-code</text><text x="588" y="288" font-size="12.5" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ claude</text><rect x="566" y="326" width="316" height="28" rx="7" fill="#24242B"/><text x="580" y="345" font-size="12.5" font-weight="600" fill="#7EE0C3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">› paste docs/FIRST-PROMPT.md</text><path d="M912,210.0 L952,210.0" fill="none" stroke="#0E7C66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m0E7C66)"/><rect x="964" y="49.5" width="268" height="324" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="964" y="48" width="268" height="324" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><text x="986" y="82" font-size="14.5" font-weight="700" fill="#1C1B19" text-anchor="start">Then Claude Code</text><circle cx="994" cy="116" r="8.5" fill="#0E7C66" fill-opacity="0.16"/><path d="M990,116 L993,119 L998.5,112" fill="none" stroke="#0E7C66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1012" y="120" font-size="13.5" font-weight="500" fill="#1C1B19" text-anchor="start">maps the machine</text><circle cx="994" cy="147" r="8.5" 